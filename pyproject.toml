[project]
name = "asvs-origins"
version = "0.1.0"
description = "Provenance records for OWASP ASVS requirements"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Armstrong" }]
dependencies = [
  "jsonschema>=4.23.0",
  "referencing>=0.35.0",
  "rfc3987>=1.3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
asvs-origins-validate = "pipeline.validate.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
